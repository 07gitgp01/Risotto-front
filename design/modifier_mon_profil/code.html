<script>
  // Dynamic counter for bio textarea
  const bioTextarea = document.getElementById('bio');
  const bioCounter = document.getElementById('bio-counter');

  if (bioTextarea && bioCounter) {
    bioTextarea.addEventListener('input', () => {
      const currentLength = bioTextarea.value.length;
      bioCounter.textContent = `${currentLength} / 300`;
    });
  }

  // Micro-interaction: add suggested tag chip
  function addTag(btn, tagLabel) {
    const container = document.getElementById('chips-container');
    const trigger = document.getElementById('add-sector-trigger');
    if (!container || !trigger) return;

    const newChip = document.createElement('span');
    newChip.className = 'h-9 px-space-md rounded-full bg-secondary text-on-secondary font-label-md text-label-md inline-flex items-center gap-1 shadow-sm';
    newChip.innerHTML = `${tagLabel} <button type="button" onclick="this.parentElement.remove()" class="hover:opacity-75 transition-opacity ml-1 flex items-center" aria-label="Supprimer ${tagLabel}"><span class="material-symbols-outlined text-sm">close</span></button>`;
    
    container.insertBefore(newChip, trigger);
    btn.remove();
  }

  // Interactive add custom tag via trigger
  const addTrigger = document.getElementById('add-sector-trigger');
  if (addTrigger) {
    addTrigger.addEventListener('click', () => {
      const sector = prompt("Entrez un nouveau secteur d'activité :");
      if (sector && sector.trim().length > 0) {
        const container = document.getElementById('chips-container');
        const newChip = document.createElement('span');
        newChip.className = 'h-9 px-space-md rounded-full bg-secondary text-on-secondary font-label-md text-label-md inline-flex items-center gap-1 shadow-sm';
        newChip.innerHTML = `${sector.trim()} <button type="button" onclick="this.parentElement.remove()" class="hover:opacity-75 transition-opacity ml-1 flex items-center"><span class="material-symbols-outlined text-sm">close</span></button>`;
        container.insertBefore(newChip, addTrigger);
      }
    });
  }

  // Preview local image upload
  const avatarUpload = document.getElementById('avatar-upload');
  const profileAvatar = document.getElementById('profile-avatar');
  if (avatarUpload && profileAvatar) {
    avatarUpload.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = (event) => {
          profileAvatar.src = event.target.result;
        };
        reader.readAsDataURL(file);
      }
    });
  }

  // Form submit micro-interaction feedback
  const form = document.getElementById('edit-profile-form');
  if (form) {
    form.addEventListener('submit', (e) => {
      e.preventDefault();
      const saveBtn = form.querySelector('button[type="submit"]');
      if (saveBtn) {
        const originalContent = saveBtn.innerHTML;
        saveBtn.innerHTML = '<span class="material-symbols-outlined animate-spin text-xl">progress_activity</span><span>Enregistrement en cours...</span>';
        setTimeout(() => {
          saveBtn.innerHTML = '<span class="material-symbols-outlined text-xl">done_all</span><span>Profil mis à jour !</span>';
          setTimeout(() => {
            saveBtn.innerHTML = originalContent;
          }, 2500);
        }, 800);
      }
    });
  }
</script></main></body></html>
